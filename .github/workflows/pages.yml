name: Deploy GitHub Pages

# publish.sh force-pushes gh-pages, then triggers this via workflow_dispatch.
# (Push-to-gh-pages alone does not reliably start Actions.)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-site]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.page_url }}
    steps:
      # Checkout site content from gh-pages (not main).
      # NOTE: actions/deploy-pages uses GITHUB_SHA from the workflow ref (main).
      # publish.sh bumps .github/pages-deploy-stamp on main before each dispatch
      # so each deploy gets a unique pages_build_version; otherwise GitHub Pages
      # can report success while leaving the live site on an older artifact.
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Validate built site
        run: |
          test -f index.html
          test -f data/catalog.json
          test -d tiles
          count=$(find tiles -name '*.png' | wc -l)
          echo "PNG tiles: $count"
          test "$count" -gt 0
          echo "gh-pages commit: $(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          c = json.load(open("data/catalog.json"))
          dates = c.get("available_dates", [])
          print(f"catalog products: {c['product_count']}")
          print(f"catalog latest dates: {dates[-5:]}")
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      # GitHub Pages sometimes fails transiently while syncing (~300MB sites).
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "First deploy failed — waiting 30s and retrying…"
          sleep 30

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - id: final
        if: always()
        run: |
          if [ "${{ steps.deploy1.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deploy1.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.deploy2.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Deploy failed after retry"
          exit 1
