name: Deploy GitHub Pages

# publish.sh force-pushes gh-pages, then triggers this via workflow_dispatch.
# (Push-to-gh-pages alone does not reliably start Actions.)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-site]

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel queued/stale deploys. Leaving cancel-in-progress=false let a single
# "waiting" environment job block the queue for hours and make cron time out.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.page_url }}
    steps:
      # Checkout site content from gh-pages (not main).
      # NOTE: actions/deploy-pages uses GITHUB_SHA from the workflow ref (main).
      # publish.sh bumps .github/pages-deploy-stamp on main before each dispatch
      # so each deploy gets a unique pages_build_version; otherwise GitHub Pages
      # can report success while leaving the live site on an older artifact.
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Validate built site
        run: |
          test -f index.html
          test -f data/catalog.json
          test -d tiles
          count=$(find tiles -name '*.png' | wc -l)
          echo "PNG tiles: $count"
          test "$count" -gt 0
          echo "gh-pages commit: $(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          c = json.load(open("data/catalog.json"))
          dates = c.get("available_dates", [])
          print(f"catalog products: {c['product_count']}")
          print(f"catalog latest dates: {dates[-5:]}")
          PY

      - name: Log artifact size
        run: |
          du -sh .
          echo "PNG tiles: $(find tiles -name '*.png' | wc -l)"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      # GitHub Pages often fails transiently while syncing large sites (~300MB).
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "Deploy attempt 1 failed during Pages sync — waiting 90s…"
          sleep 90

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "Deploy attempt 2 failed — waiting 180s…"
          sleep 180

      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - id: final
        if: always()
        run: |
          if [ "${{ steps.deploy1.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deploy1.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            echo "Succeeded on deploy1"
            exit 0
          fi
          if [ "${{ steps.deploy2.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            echo "Succeeded on deploy2"
            exit 0
          fi
          if [ "${{ steps.deploy3.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deploy3.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            echo "Succeeded on deploy3"
            exit 0
          fi
          echo "Deploy failed after 3 attempts (Pages sync error — re-run workflow or wait for publish.sh auto-retry)"
          exit 1
